version: '3.9'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofibowl
      POSTGRES_PASSWORD: ofibowl
      POSTGRES_DB: ofibowlidg
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./ofibowlidg/backend/prisma/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ofibowl -d ofibowlidg']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ofibowlidg/backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://ofibowl:ofibowl@db:5432/ofibowlidg
      JWT_SECRET: supersecreto
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ofibowlidg/backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./ofibowlidg/frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./ofibowlidg/frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db-data:
